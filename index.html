<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>个人作品集 | Portfolio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollToPlugin.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap" rel="stylesheet">
  <style>
    :root{--bg-primary:#0a0a0f;--bg-secondary:#12121a;--bg-card:#1a1a25;--text-primary:#ffffff;--text-secondary:#a0a0b0;--accent:#6366f1;--accent-glow:rgba(99,102,241,.3)}
    *{margin:0;padding:0;box-sizing:border-box}html{scroll-behavior:smooth}body{font-family:'Manrope',sans-serif;background:var(--bg-primary);color:var(--text-primary);overflow-x:hidden}.font-display{font-family:'Fraunces',serif}
    #webgl-bg{position:fixed;inset:0;width:100%;height:100%;z-index:-1;opacity:.6}.noise-overlay{position:fixed;inset:0;pointer-events:none;z-index:1000;opacity:.03;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E")}
    .glass-card{background:rgba(26,26,37,.62);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.08);border-radius:24px}.gradient-text{background:linear-gradient(135deg,#fff 0%,#b6b6c7 46%,#6366f1 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}.btn-primary{display:inline-flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#6366f1 0%,#8b5cf6 100%);border:none;padding:16px 32px;border-radius:12px;color:#fff;font-weight:700;cursor:pointer;transition:all .3s ease;position:relative;overflow:hidden}.btn-primary:before{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.24),transparent);transition:left .5s ease}.btn-primary:hover:before{left:100%}.btn-primary:hover{transform:translateY(-2px);box-shadow:0 20px 40px rgba(99,102,241,.4)}.btn-outline{display:inline-flex;align-items:center;justify-content:center;background:transparent;border:1px solid rgba(255,255,255,.2);padding:16px 32px;border-radius:12px;color:#fff;font-weight:700;cursor:pointer;transition:all .3s ease}.btn-outline:hover{background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.4)}
    .nav-blur{background:rgba(10,10,15,.82);backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,.05)}.scroll-indicator{width:24px;height:40px;border:2px solid rgba(255,255,255,.3);border-radius:12px;position:relative}.scroll-indicator:after{content:'';position:absolute;top:8px;left:50%;transform:translateX(-50%);width:4px;height:8px;background:white;border-radius:2px;animation:scrollBounce 2s infinite}@keyframes scrollBounce{0%,100%{transform:translateX(-50%) translateY(0);opacity:1}50%{transform:translateX(-50%) translateY(8px);opacity:.5}}
    .project-card{transition:all .5s cubic-bezier(.4,0,.2,1)}.project-card:hover{transform:translateY(-8px) scale(1.02)}.project-card:hover .project-image{transform:scale(1.1)}.project-image{transition:transform .7s cubic-bezier(.4,0,.2,1)}.skill-tag{background:rgba(99,102,241,.1);border:1px solid rgba(99,102,241,.3);padding:8px 16px;border-radius:20px;font-size:14px;transition:all .3s ease}.skill-tag:hover{background:rgba(99,102,241,.2);transform:translateY(-2px)}.stat-number{font-size:4rem;font-weight:800;line-height:1}.contact-gradient{background:radial-gradient(ellipse at center,rgba(99,102,241,.15) 0%,transparent 70%)}.reveal{opacity:0;transform:translateY(30px)}::-webkit-scrollbar{width:8px}::-webkit-scrollbar-track{background:var(--bg-primary)}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:4px}::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.2)}
    .editor-link{position:fixed;right:20px;bottom:20px;z-index:1200;background:#fff;color:#111;padding:12px 16px;border-radius:999px;font-weight:800;box-shadow:0 12px 36px rgba(0,0,0,.35);transition:.25s}.editor-link:hover{transform:translateY(-3px)}
  </style>
</head>
<body>
  <div class="noise-overlay"></div><canvas id="webgl-bg"></canvas><div id="app"></div><a class="editor-link" href="editor.html" target="_blank">编辑内容</a>
  <script src="content.js"></script>
  <script>
    const C = window.SITE_CONTENT;
    const esc = (v='') => String(v).replace(/[&<>'"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]));
    const socialIcon = `<svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2a10 10 0 100 20 10 10 0 000-20zm1 14.93V13h3.4a8.02 8.02 0 01-3.4 3.93zM13 11V7.07A8.02 8.02 0 0116.4 11H13zm-2 0H7.6A8.02 8.02 0 0111 7.07V11zm0 2v3.93A8.02 8.02 0 017.6 13H11z"/></svg>`;
    const arrowIcon = `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8l4 4m0 0l-4 4m4-4H3"/></svg>`;
    const skillIcon = `<svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 16v-2m8-6h-2M6 12H4m12.95 4.95l-1.41-1.41M8.46 8.46L7.05 7.05m9.9 0l-1.41 1.41M8.46 15.54l-1.41 1.41"/></svg>`;

    function render() {
      document.title = C.site.title;
      document.getElementById('app').innerHTML = `
        <nav id="navbar" class="fixed top-0 left-0 right-0 z-50 transition-all duration-500">
          <div class="max-w-[1700px] mx-auto px-8 py-6 flex items-center justify-between">
            <a href="#" class="font-display text-2xl font-bold tracking-tight">${esc(C.site.logo).replace(/\.$/, '<span class="text-indigo-500">.</span>')}</a>
            <div class="hidden md:flex items-center gap-8">
              <a href="#about" class="text-sm text-gray-400 hover:text-white transition-colors">${esc(C.nav.about)}</a><a href="#projects" class="text-sm text-gray-400 hover:text-white transition-colors">${esc(C.nav.projects)}</a><a href="#skills" class="text-sm text-gray-400 hover:text-white transition-colors">${esc(C.nav.skills)}</a><a href="#contact" class="btn-primary text-sm py-3 px-6">${esc(C.nav.contact)}</a>
            </div>
          </div>
        </nav>
        <section id="hero" class="relative min-h-screen flex items-center justify-center overflow-hidden"><div class="max-w-[1700px] mx-auto px-8 py-32 relative z-10"><div class="grid lg:grid-cols-2 gap-16 items-center"><div class="space-y-8"><div class="reveal"><span class="text-indigo-400 text-sm font-medium tracking-widest uppercase">${esc(C.hero.eyebrow)}</span></div><h1 class="font-display text-6xl md:text-7xl lg:text-8xl font-bold leading-[0.95] reveal"><span class="gradient-text">${esc(C.hero.titleHighlight)}</span><br><span class="text-white">${esc(C.hero.titleMain)}</span></h1><p class="text-xl text-gray-400 max-w-lg leading-relaxed reveal">${esc(C.hero.subtitle)}</p><div class="flex flex-wrap gap-4 reveal"><a href="#projects" class="btn-primary">${esc(C.hero.primaryButton)}</a><a href="#contact" class="btn-outline">${esc(C.hero.secondaryButton)}</a></div><div class="flex items-center gap-8 pt-8 reveal">${C.hero.stats.map((s,i)=>`<div>${i?'<div class="w-px h-12 bg-gray-800 absolute"></div>':''}<div class="text-3xl font-bold text-white">${esc(s.value)}</div><div class="text-sm text-gray-500">${esc(s.label)}</div></div>`).join('<div class="w-px h-12 bg-gray-800"></div>')}</div></div><div class="relative reveal"><div class="relative aspect-square max-w-lg mx-auto"><div class="absolute inset-0 bg-gradient-to-br from-indigo-500/20 to-purple-500/20 rounded-3xl blur-3xl"></div><div class="glass-card relative overflow-hidden aspect-square"><img src="${esc(C.hero.image)}" alt="${esc(C.hero.imageAlt)}" class="w-full h-full object-cover"><div class="absolute inset-0 bg-gradient-to-t from-black/60 via-transparent to-transparent"></div><div class="absolute bottom-6 left-6 right-6"><div class="text-sm text-gray-300 mb-1">${esc(C.hero.statusLabel)}</div><div class="flex items-center gap-2"><span class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span><span class="text-white font-medium">${esc(C.hero.statusText)}</span></div></div></div></div></div></div></div><div class="absolute bottom-12 left-1/2 -translate-x-1/2 flex flex-col items-center gap-4"><span class="text-xs text-gray-500 tracking-widest uppercase">Scroll</span><div class="scroll-indicator"></div></div></section>
        <section id="about" class="py-32 relative"><div class="max-w-[1700px] mx-auto px-8"><div class="grid lg:grid-cols-12 gap-16"><div class="lg:col-span-4"><div class="sticky top-32"><span class="text-indigo-400 text-sm font-medium tracking-widest uppercase reveal">${esc(C.about.eyebrow)}</span><h2 class="font-display text-4xl md:text-5xl font-bold mt-4 mb-6 reveal">${esc(C.about.titleTop)}<br><span class="gradient-text">${esc(C.about.titleHighlight)}</span></h2><p class="text-gray-400 leading-relaxed reveal">${esc(C.about.description)}</p></div></div><div class="lg:col-span-8 space-y-8">${C.about.experiences.map(e=>`<div class="glass-card p-8 reveal"><div class="flex flex-wrap items-start justify-between gap-4 mb-4"><div><h3 class="text-xl font-semibold text-white">${esc(e.role)}</h3><p class="text-indigo-400">${esc(e.company)}</p></div><span class="text-sm text-gray-500">${esc(e.period)}</span></div><p class="text-gray-400 leading-relaxed">${esc(e.description)}</p></div>`).join('')}<div class="grid grid-cols-2 md:grid-cols-4 gap-6 pt-8">${C.about.stats.map(s=>`<div class="text-center reveal"><div class="stat-number gradient-text" data-count="${Number(s.value)||0}" data-suffix="${esc(s.suffix)}">0</div><div class="text-gray-500 text-sm mt-2">${esc(s.label)}</div></div>`).join('')}</div></div></div></div></section>
        <section id="projects" class="py-32 relative"><div class="max-w-[1700px] mx-auto px-8"><div class="text-center max-w-2xl mx-auto mb-20"><span class="text-indigo-400 text-sm font-medium tracking-widest uppercase reveal">${esc(C.projectsSection.eyebrow)}</span><h2 class="font-display text-4xl md:text-5xl font-bold mt-4 mb-6 reveal">${esc(C.projectsSection.titlePrefix)}<span class="gradient-text">${esc(C.projectsSection.titleHighlight)}</span></h2><p class="text-gray-400 reveal">${esc(C.projectsSection.description)}</p></div><div class="grid md:grid-cols-2 gap-8">${C.projects.map((p,i)=>`<div class="project-card glass-card overflow-hidden reveal"><div class="aspect-[4/3] overflow-hidden"><img src="${esc(p.image)}" alt="${esc(p.title)}" class="project-image w-full h-full object-cover" loading="lazy"></div><div class="p-8"><div class="flex items-center gap-2 mb-3"><span class="text-xs text-indigo-400 font-medium px-3 py-1 bg-indigo-500/10 rounded-full">${esc(p.category)}</span><span class="text-xs text-gray-500">${esc(p.year)}</span></div><h3 class="text-2xl font-semibold text-white mb-3">${esc(p.title)}</h3><p class="text-gray-400 mb-6">${esc(p.description)}</p><a href="${esc(p.link||'#')}" class="inline-flex items-center gap-2 text-white hover:text-indigo-400 transition-colors">查看详情 ${arrowIcon}</a></div></div>`).join('')}</div></div></section>
        <section id="skills" class="py-32 relative"><div class="max-w-[1700px] mx-auto px-8"><div class="text-center max-w-2xl mx-auto mb-20"><span class="text-indigo-400 text-sm font-medium tracking-widest uppercase reveal">${esc(C.skillsSection.eyebrow)}</span><h2 class="font-display text-4xl md:text-5xl font-bold mt-4 mb-6 reveal">${esc(C.skillsSection.titlePrefix)}<span class="gradient-text">${esc(C.skillsSection.titleHighlight)}</span></h2><p class="text-gray-400 reveal">${esc(C.skillsSection.description)}</p></div><div class="grid md:grid-cols-3 gap-8">${C.skillGroups.map(g=>`<div class="glass-card p-8 reveal"><div class="w-14 h-14 bg-indigo-500/20 rounded-2xl flex items-center justify-center mb-6 text-indigo-400">${skillIcon}</div><h3 class="text-xl font-semibold text-white mb-4">${esc(g.title)}</h3><div class="flex flex-wrap gap-2">${g.items.map(x=>`<span class="skill-tag">${esc(x)}</span>`).join('')}</div></div>`).join('')}</div></div></section>
        <section id="contact" class="py-32 relative min-h-screen flex items-center contact-gradient"><div class="max-w-[1700px] mx-auto px-8 w-full"><div class="grid lg:grid-cols-2 gap-16 items-center"><div><span class="text-indigo-400 text-sm font-medium tracking-widest uppercase reveal">${esc(C.contact.eyebrow)}</span><h2 class="font-display text-5xl md:text-6xl lg:text-7xl font-bold mt-4 mb-8 reveal">${esc(C.contact.titleTop)}<br><span class="gradient-text">${esc(C.contact.titleHighlight)}</span></h2><p class="text-xl text-gray-400 mb-12 max-w-lg reveal">${esc(C.contact.description)}</p><div class="space-y-6 reveal"><a href="mailto:${esc(C.contact.email)}" class="flex items-center gap-4 text-gray-300 hover:text-white transition-colors group"><div class="w-12 h-12 bg-white/5 rounded-xl flex items-center justify-center group-hover:bg-indigo-500/20 transition-colors">@</div><span>${esc(C.contact.email)}</span></a>${C.contact.links.map(l=>`<a href="${esc(l.url)}" class="flex items-center gap-4 text-gray-300 hover:text-white transition-colors group"><div class="w-12 h-12 bg-white/5 rounded-xl flex items-center justify-center group-hover:bg-indigo-500/20 transition-colors">${socialIcon}</div><span>${esc(l.label)}</span></a>`).join('')}</div></div><div class="reveal"><form class="glass-card p-8 md:p-12 space-y-6"><div><label class="block text-sm text-gray-400 mb-2">${esc(C.contact.form.nameLabel)}</label><input type="text" class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-white placeholder-gray-500 focus:outline-none focus:border-indigo-500 transition-colors" placeholder="${esc(C.contact.form.namePlaceholder)}"></div><div><label class="block text-sm text-gray-400 mb-2">${esc(C.contact.form.emailLabel)}</label><input type="email" class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-white placeholder-gray-500 focus:outline-none focus:border-indigo-500 transition-colors" placeholder="${esc(C.contact.form.emailPlaceholder)}"></div><div><label class="block text-sm text-gray-400 mb-2">${esc(C.contact.form.typeLabel)}</label><select class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-indigo-500 transition-colors"><option class="bg-gray-900">${esc(C.contact.form.typePlaceholder)}</option>${C.contact.form.typeOptions.map(o=>`<option class="bg-gray-900">${esc(o)}</option>`).join('')}</select></div><div><label class="block text-sm text-gray-400 mb-2">${esc(C.contact.form.messageLabel)}</label><textarea rows="4" class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-white placeholder-gray-500 focus:outline-none focus:border-indigo-500 transition-colors resize-none" placeholder="${esc(C.contact.form.messagePlaceholder)}"></textarea></div><button type="submit" class="btn-primary w-full">${esc(C.contact.form.submitText)}</button></form></div></div></div></section>
        <footer class="py-8 border-t border-white/5"><div class="max-w-[1700px] mx-auto px-8 flex flex-wrap items-center justify-between gap-4"><p class="text-gray-500 text-sm">${esc(C.site.footerLeft)}</p><p class="text-gray-600 text-sm">${esc(C.site.footerRight)}</p></div></footer>`;
    }

    function initAnimations(){
      gsap.registerPlugin(ScrollTrigger, ScrollToPlugin);
      ScrollTrigger.create({start:'top -100',onUpdate:self=>{const n=document.getElementById('navbar'); if(self.scroll()>100)n.classList.add('nav-blur');else n.classList.remove('nav-blur')}});
      document.querySelectorAll('.reveal').forEach((el,i)=>gsap.to(el,{scrollTrigger:{trigger:el,start:'top 85%',toggleActions:'play none none none'},opacity:1,y:0,duration:.8,ease:'power3.out',delay:Math.min(i*.025,.25)}));
      document.querySelectorAll('.stat-number').forEach(stat=>{const target=parseInt(stat.dataset.count)||0;const suffix=stat.dataset.suffix||'';gsap.to(stat,{scrollTrigger:{trigger:stat,start:'top 80%'},innerHTML:target,duration:2,ease:'power2.out',snap:{innerHTML:1},onUpdate(){stat.innerHTML=Math.round(this.targets()[0].innerHTML)+suffix}})});
      gsap.to('#hero .glass-card',{scrollTrigger:{trigger:'#hero',start:'top top',end:'bottom top',scrub:1},y:100,ease:'none'});
      document.querySelectorAll('a[href^="#"]').forEach(a=>a.addEventListener('click',e=>{const t=document.querySelector(a.getAttribute('href')); if(t){e.preventDefault();gsap.to(window,{duration:1,scrollTo:{y:t,offsetY:80},ease:'power3.inOut'})}}));
      document.querySelector('form')?.addEventListener('submit',e=>{e.preventDefault();alert(C.contact.form.successMessage)});
    }

    function initWebGL(){
      if(!window.THREE)return;const canvas=document.getElementById('webgl-bg');const renderer=new THREE.WebGLRenderer({canvas,alpha:true,antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));const scene=new THREE.Scene();const camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.1,1000);camera.position.z=30;const geo=new THREE.BufferGeometry();const count=220;const pos=new Float32Array(count*3);for(let i=0;i<count*3;i++)pos[i]=(Math.random()-.5)*100;geo.setAttribute('position',new THREE.BufferAttribute(pos,3));const mat=new THREE.PointsMaterial({size:.2,color:0x6366f1,transparent:true,opacity:.6,blending:THREE.AdditiveBlending});const pts=new THREE.Points(geo,mat);scene.add(pts);const planeGeo=new THREE.PlaneGeometry(100,100,32,32);const planeMat=new THREE.ShaderMaterial({uniforms:{uTime:{value:0},uColor1:{value:new THREE.Color(0x6366f1)},uColor2:{value:new THREE.Color(0x8b5cf6)}},vertexShader:'varying vec2 vUv;uniform float uTime;void main(){vUv=uv;vec3 pos=position;pos.z+=sin(pos.x*.1+uTime)*2.;pos.z+=cos(pos.y*.1+uTime)*2.;gl_Position=projectionMatrix*modelViewMatrix*vec4(pos,1.);}',fragmentShader:'uniform vec3 uColor1;uniform vec3 uColor2;uniform float uTime;varying vec2 vUv;void main(){float m=sin(vUv.x*3.14159+uTime*.5)*.5+.5;vec3 color=mix(uColor1,uColor2,m);float alpha=.15*(1.-length(vUv-.5)*1.5);gl_FragColor=vec4(color,alpha);}',transparent:true,side:THREE.DoubleSide});const plane=new THREE.Mesh(planeGeo,planeMat);plane.position.z=-20;scene.add(plane);let id,visible=true;function animate(){if(!visible)return;id=requestAnimationFrame(animate);const time=performance.now()*.001;planeMat.uniforms.uTime.value=time;pts.rotation.y=time*.05;pts.rotation.x=time*.02;renderer.render(scene,camera)}animate();document.addEventListener('visibilitychange',()=>{visible=!document.hidden;if(visible)animate();else cancelAnimationFrame(id)});addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
    }
    render(); initWebGL(); initAnimations();
  </script>
</body>
</html>
