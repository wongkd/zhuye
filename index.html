      .projects-grid,.skills-grid{grid-template-columns:1fr;gap:16px}.project-card,.skill-card,.quote-form{border-radius:28px}.project-media{aspect-ratio:1.24/1;background:#f5f5f7}.project-body{padding:23px 22px 24px}.badge{background:#fbf7ef;color:#8a6a43;border-color:rgba(174,133,85,.2)}.year{color:#86868b}.project-body h3,.skill-card h3{color:#1d1d1f;font-size:24px;letter-spacing:-.045em}.project-body p{color:#515154;font-size:15px;line-height:1.68}.text-link{color:#8a6a43}.skill-card{padding:24px}.icon-box{background:#fbf7ef;color:#8a6a43}.skill-tag{background:#f5f5f7;border-color:rgba(0,0,0,.06);color:#515154}
      .contact{padding-bottom:88px;background:#f5f5f7}.contact-copy .section-head,.contact-copy .section-title{text-align:center}.contact-links{gap:10px;margin-top:24px}.contact-link{background:#fff;border-color:rgba(0,0,0,.06);color:#1d1d1f;box-shadow:0 10px 24px rgba(0,0,0,.05)}.contact-icon{background:#f5f5f7;color:#8a6a43}.field label{color:#515154}.field input,.field select,.field textarea{background:#f5f5f7;border-color:rgba(0,0,0,.08);color:#1d1d1f}.field input::placeholder,.field textarea::placeholder{color:#9a9a9f}.form-note,footer{color:#86868b}footer{background:#f5f5f7;border-top-color:rgba(0,0,0,.06)}.footer-row{justify-content:center;text-align:center}
    }
    @media (min-width:768px){.hero-stats-mobile{display:none}}
    @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}.reveal{opacity:1!important;transform:none!important}}
  </style>
</head>
<body>
  <div class="noise-overlay"></div>
  <canvas id="webgl-bg" aria-hidden="true"></canvas>
  <div id="app"></div>
  <a class="editor-link js-edit-entry" href="editor.html" target="_blank" rel="noopener">编辑</a>
  <script src="content.js"></script>
  <script>
    const C = window.SITE_CONTENT || {};
    const esc = (v='') => String(v).replace(/[&<>'"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]));
    const arrowIcon = `<svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8l4 4m0 0l-4 4m4-4H3"/></svg>`;
    const skillIcon = `<svg width="26" height="26" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M4 7h16M7 4v16m10-16v16M4 17h16"/></svg>`;
    const contactIcon = `<svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4"/></svg>`;

    function render(){
      document.title = C.site?.title || '广东表里如一工程有限公司 | BLRY';
      document.getElementById('app').innerHTML = `
        <nav id="navbar" class="nav-shell" aria-label="主导航">
          <div class="nav-inner">
            <a class="brand" href="#hero" aria-label="返回首页"><span class="brand-mark${C.site.logoImage ? ' has-logo' : ''}">${C.site.logoImage ? `<img src="${esc(C.site.logoImage)}" alt="${esc(C.site.logoImageAlt || '公司 LOGO')}">` : 'BL'}</span><span class="brand-text">${esc(C.site.logo).replace(/\.$/,'<span class="gradient-text">.</span>')}</span></a>
            <div class="nav-links">
              <a href="#about">${esc(C.nav.about)}</a>
              <a href="#projects">${esc(C.nav.projects)}</a>
              <a href="#skills">${esc(C.nav.skills)}</a>
              <a href="#contact">${esc(C.nav.contact)}</a>
            </div>
            <button id="menuToggle" class="menu-toggle" type="button" aria-controls="mobileMenu" aria-expanded="false">菜单</button>
          </div>
          <div id="mobileMenu" class="mobile-menu">
            <a href="#about">${esc(C.nav.about)} ${arrowIcon}</a>
            <a href="#projects">${esc(C.nav.projects)} ${arrowIcon}</a>
            <a href="#skills">${esc(C.nav.skills)} ${arrowIcon}</a>
            <a href="#contact">${esc(C.nav.contact)} ${arrowIcon}</a>
            <a class="js-edit-entry" href="editor.html" target="_blank" rel="noopener">编辑 ${arrowIcon}</a>
          </div>
        </nav>

        <main>
          <section id="hero" class="hero">
            <div class="container-page hero-grid">
              <div class="hero-copy">
                <span class="eyebrow reveal">${esc(C.hero.eyebrow)}</span>
                <h1 class="font-display hero-title reveal"><span class="gradient-text">${esc(C.hero.titleHighlight)}</span><br><span>${esc(C.hero.titleMain)}</span></h1>
                <p class="hero-subtitle reveal">${esc(C.hero.subtitle)}</p>
                <div class="hero-actions reveal">
                  <a href="#projects" class="btn-primary">${esc(C.hero.primaryButton)} ${arrowIcon}</a>
                  <a href="#contact" class="btn-outline">${esc(C.hero.secondaryButton)}</a>
                </div>
                <div class="stats-row hero-stats-desktop reveal">
                  ${(C.hero.stats||[]).map(s=>`<div class="stat-pill"><strong>${esc(s.value)}</strong><span>${esc(s.label)}</span></div>`).join('')}
                </div>
              </div>
              <div class="hero-visual reveal">
                <div class="hero-frame">
                  <img src="${esc(C.hero.image)}" alt="${esc(C.hero.imageAlt)}" loading="eager">
                  <div class="status-card"><small>${esc(C.hero.statusLabel)}</small><strong>${esc(C.hero.statusText)}</strong></div>
                </div>
              </div>
              <div class="stats-row hero-stats-mobile reveal">
                ${(C.hero.stats||[]).map(s=>`<div class="stat-pill"><strong>${esc(s.value)}</strong><span>${esc(s.label)}</span></div>`).join('')}
              </div>
            </div>
          </section>

          <section id="about" class="scroll-stage">
            <div class="container-page about-grid">
              <div class="sticky-copy">
                <span class="eyebrow reveal">${esc(C.about.eyebrow)}</span>
                <h2 class="font-display section-title reveal">${esc(C.about.titleTop)}<br><span class="gradient-text">${esc(C.about.titleHighlight)}</span></h2>
                <p class="section-desc reveal">${esc(C.about.description)}</p>
              </div>
              <div>
                <div class="timeline">
                  ${(C.about.experiences||[]).map(e=>`<article class="glass-card timeline-card reveal"><div class="timeline-top"><div><h3>${esc(e.role)}</h3><div class="company">${esc(e.company)}</div></div><span class="period">${esc(e.period)}</span></div><p>${esc(e.description)}</p></article>`).join('')}
                </div>
                <div class="about-stats">
                  ${(C.about.stats||[]).map(s=>`<div class="glass-card about-stat reveal"><div class="stat-number gradient-text" data-count="${Number(s.value)||0}" data-suffix="${esc(s.suffix)}">${esc(s.value)}${esc(s.suffix)}</div><div class="text-[13px] text-stone-400 mt-2">${esc(s.label)}</div></div>`).join('')}
                </div>
              </div>
            </div>
          </section>

          <section id="projects" class="scroll-stage">
            <div class="container-page">
              <div class="section-head">
                <span class="eyebrow reveal">${esc(C.projectsSection.eyebrow)}</span>
                <h2 class="font-display section-title reveal">${esc(C.projectsSection.titlePrefix)}<span class="gradient-text">${esc(C.projectsSection.titleHighlight)}</span></h2>
                <p class="section-desc reveal">${esc(C.projectsSection.description)}</p>
              </div>
              <div class="projects-grid">
                ${(C.projects||[]).map(p=>`<article class="project-card glass-card reveal"><div class="project-media"><img src="${esc(p.image)}" alt="${esc(p.title)}" class="project-image" loading="lazy"></div><div class="project-body"><div class="meta-row"><span class="badge">${esc(p.category)}</span><span class="year">${esc(p.year)}</span></div><h3>${esc(p.title)}</h3><p>${esc(p.description)}</p><a href="${esc(p.link||'#contact')}" class="text-link">咨询类似方案 ${arrowIcon}</a></div></article>`).join('')}
              </div>
            </div>
          </section>

          <section id="skills" class="scroll-stage">
            <div class="container-page">
              <div class="section-head">
                <span class="eyebrow reveal">${esc(C.skillsSection.eyebrow)}</span>
                <h2 class="font-display section-title reveal">${esc(C.skillsSection.titlePrefix)}<span class="gradient-text">${esc(C.skillsSection.titleHighlight)}</span></h2>
                <p class="section-desc reveal">${esc(C.skillsSection.description)}</p>
              </div>
              <div class="skills-grid">
                ${(C.skillGroups||[]).map(g=>`<article class="glass-card skill-card reveal"><div class="icon-box">${skillIcon}</div><h3>${esc(g.title)}</h3><div class="skill-tags">${(g.items||[]).map(x=>`<span class="skill-tag">${esc(x)}</span>`).join('')}</div></article>`).join('')}
              </div>
            </div>
          </section>

          <section id="contact" class="contact scroll-stage">
            <div class="container-page contact-grid">
              <div class="contact-copy">
                <div class="section-head">
                  <span class="eyebrow reveal">${esc(C.contact.eyebrow)}</span>
                  <h2 class="font-display section-title reveal">${esc(C.contact.titleTop)}<br><span class="gradient-text">${esc(C.contact.titleHighlight)}</span></h2>
                  <p class="section-desc reveal">${esc(C.contact.description)}</p>
                </div>
                <div class="contact-links reveal">
                  <a class="contact-link" href="mailto:${esc(C.contact.email)}"><span class="contact-icon">@</span><span>${esc(C.contact.email)}</span></a>
                  ${(C.contact.links||[]).map(l=>`<a class="contact-link" href="${esc(l.url)}"><span class="contact-icon">${contactIcon}</span><span>${esc(l.label)}</span></a>`).join('')}
                </div>
              </div>
              <form class="glass-card quote-form reveal">
                <div class="field"><label for="name">${esc(C.contact.form.nameLabel)}</label><input id="name" type="text" placeholder="${esc(C.contact.form.namePlaceholder)}" autocomplete="name"></div>
                <div class="field"><label for="email">${esc(C.contact.form.emailLabel)}</label><input id="email" type="text" placeholder="${esc(C.contact.form.emailPlaceholder)}" autocomplete="email"></div>
                <div class="field"><label for="type">${esc(C.contact.form.typeLabel)}</label><select id="type"><option>${esc(C.contact.form.typePlaceholder)}</option>${(C.contact.form.typeOptions||[]).map(o=>`<option>${esc(o)}</option>`).join('')}</select></div>
                <div class="field"><label for="message">${esc(C.contact.form.messageLabel)}</label><textarea id="message" placeholder="${esc(C.contact.form.messagePlaceholder)}"></textarea></div>
                <button class="btn-primary submit-btn" type="submit">${esc(C.contact.form.submitText)} ${arrowIcon}</button>
                <p class="form-note">提交后页面会提示已记录；正式沟通建议同时发送邮箱，便于附户型图和现场照片。</p>
              </form>
            </div>
          </section>
        </main>

        <footer>
          <div class="container-page footer-row"><p>${esc(C.site.footerLeft)}</p><p>${esc(C.site.footerRight)}</p></div>
        </footer>`;
    }

    function initMenu(){
      const nav = document.getElementById('navbar');
      const btn = document.getElementById('menuToggle');
      const menu = document.getElementById('mobileMenu');
      btn?.addEventListener('click',()=>{
        const open = !menu.classList.contains('open');
        menu.classList.toggle('open',open);
        nav.classList.toggle('menu-open',open);
        btn.setAttribute('aria-expanded',String(open));
        btn.textContent = open ? '关闭' : '菜单';
      });
      menu?.querySelectorAll('a').forEach(a=>a.addEventListener('click',()=>{
        menu.classList.remove('open');nav.classList.remove('menu-open');btn.setAttribute('aria-expanded','false');btn.textContent='菜单';
      }));
    }

    function openEditorWithAuth(e){
      e?.preventDefault();
      const target = e?.currentTarget?.getAttribute('href') || 'editor.html';
      const cached = localStorage.getItem('portfolio-cms-entry-ok') || sessionStorage.getItem('portfolio-cms-entry-ok');
      let password = cached === '1' ? 'hqd125125' : prompt('请输入管理密码');
      if(password === 'hqd125125'){
        sessionStorage.setItem('portfolio-cms-entry-ok','1');
        localStorage.setItem('portfolio-cms-entry-ok','1');
        window.open(target + (target.includes('?')?'&':'?') + 'entry=auth','_blank','noopener');
      }else if(password !== null){
        alert('密码不正确，无法进入管理界面。');
      }
    }

    function initEditorGate(){
      document.querySelectorAll('.js-edit-entry').forEach(a=>a.addEventListener('click',openEditorWithAuth));
    }

    function initAnimations(){
      const isMobile = window.matchMedia('(max-width: 767px)').matches;
      const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const nav = document.getElementById('navbar');
      const setNav = () => nav?.classList.toggle('nav-blur', window.scrollY > 24);
      setNav(); window.addEventListener('scroll', setNav, { passive:true });
      document.querySelector('form')?.addEventListener('submit',e=>{e.preventDefault();alert(C.contact.form.successMessage)});
      document.querySelectorAll('a[href^="#"]').forEach(a=>a.addEventListener('click',e=>{const t=document.querySelector(a.getAttribute('href')); if(t){e.preventDefault(); if(window.gsap && !reduce){gsap.to(window,{duration:isMobile ? .55 : .85,scrollTo:{y:t,offsetY:isMobile?82:96},ease:'power3.out'})}else{t.scrollIntoView({behavior:reduce?'auto':'smooth',block:'start'})}}}));
      if(reduce || !window.gsap){document.querySelectorAll('.reveal').forEach(el=>{el.style.opacity=1;el.style.transform='none'});return;}
      gsap.registerPlugin(ScrollTrigger, ScrollToPlugin);
      if(isMobile){document.querySelectorAll('.reveal').forEach(el=>{el.style.opacity=1;el.style.transform='none'});return;}

      // Apple-style: simple fade-up reveals, no pin, no scrub, no blur
      const stDefaults = { start:'top 76%', toggleActions:'play none none none', once:true };

      // Section titles — subtle rise
      document.querySelectorAll('.section-head .reveal, .sticky-copy .reveal').forEach(el=>{
        gsap.fromTo(el, { opacity:0, y:28 }, { scrollTrigger:{trigger:el,...stDefaults}, opacity:1, y:0, duration:.65, ease:'power2.out' });
      });

      // Timeline cards — rise from below, stagger
      document.querySelectorAll('.timeline-card').forEach((el,i)=>{
        gsap.fromTo(el, { opacity:0, y:36 }, { scrollTrigger:{trigger:el,...stDefaults}, opacity:1, y:0, duration:.55, delay:Math.min(i*.08,.32), ease:'power2.out' });
      });

      // About stats — pop in
      document.querySelectorAll('.about-stat').forEach((el,i)=>{
        gsap.fromTo(el, { opacity:0, y:24, scale:.94 }, { scrollTrigger:{trigger:el,...stDefaults}, opacity:1, y:0, scale:1, duration:.5, delay:Math.min(i*.06,.2), ease:'back.out(1.4)' });
      });

      // Project cards — fade up, stagger
      document.querySelectorAll('.project-card').forEach((el,i)=>{
        gsap.fromTo(el, { opacity:0, y:48 }, { scrollTrigger:{trigger:el,...stDefaults}, opacity:1, y:0, duration:.62, delay:Math.min(i*.09,.36), ease:'power3.out' });
      });

      // Skill cards — side + fade
      document.querySelectorAll('.skill-card').forEach((el,i)=>{
        gsap.fromTo(el, { opacity:0, x:i%2===0?-28:28, y:16 }, { scrollTrigger:{trigger:el,...stDefaults}, opacity:1, x:0, y:0, duration:.52, delay:Math.min(i*.07,.28), ease:'power2.out' });
      });

      // Contact links/form — simple rise
      document.querySelectorAll('.contact-link, .quote-form').forEach((el,i)=>{
        gsap.fromTo(el, { opacity:0, y:32 }, { scrollTrigger:{trigger:el,...stDefaults}, opacity:1, y:0, duration:.58, delay:Math.min(i*.06,.18), ease:'power2.out' });
      });

      // Hero elements — staggered fade
      document.querySelectorAll('.hero .reveal').forEach((el,i)=>gsap.fromTo(el,{opacity:0,y:32},{scrollTrigger:{trigger:el,start:'top 88%',toggleActions:'play none none none'},opacity:1,y:0,duration:.72,delay:Math.min(i*.05,.25),ease:'power3.out'}));

      // Stat counters
      document.querySelectorAll('.stat-number').forEach(stat=>{const target=parseInt(stat.dataset.count)||0;const suffix=stat.dataset.suffix||'';gsap.fromTo(stat,{innerHTML:0},{scrollTrigger:{trigger:stat,start:'top 82%'},innerHTML:target,duration:1.6,ease:'power2.out',snap:{innerHTML:1},onUpdate(){stat.innerHTML=Math.round(this.targets()[0].innerHTML)+suffix}})});
    }

    function initWebGL(){
      const isMobile = window.matchMedia('(max-width: 767px)').matches;
      const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if(isMobile || reduce || !window.THREE)return;
      const canvas=document.getElementById('webgl-bg');
      const renderer=new THREE.WebGLRenderer({canvas,alpha:true,antialias:true,powerPreference:'low-power'});
      renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
      const scene=new THREE.Scene();
      const camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.1,1000);camera.position.z=30;
      const geo=new THREE.BufferGeometry();const count=150;const pos=new Float32Array(count*3);
      for(let i=0;i<count*3;i++)pos[i]=(Math.random()-.5)*100;
      geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
      const mat=new THREE.PointsMaterial({size:.18,color:0xae8555,transparent:true,opacity:.55,blending:THREE.AdditiveBlending});
      const pts=new THREE.Points(geo,mat);scene.add(pts);
      let id,visible=true;
      function animate(){if(!visible)return;id=requestAnimationFrame(animate);const time=performance.now()*.001;pts.rotation.y=time*.035;pts.rotation.x=time*.012;renderer.render(scene,camera)}
      animate();
      document.addEventListener('visibilitychange',()=>{visible=!document.hidden;if(visible)animate();else cancelAnimationFrame(id)});
      addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)},{passive:true});
    }

    render();
    initMenu();
    initEditorGate();
    initWebGL();
    initAnimations();
  </script>
</body>
</html>
