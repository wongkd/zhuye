<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f7">
  <script src="assets/theme-init.js"></script>
  <meta name="app-version" content="2.0">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/logo.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/logo.png">
  <title>广东表里如一工程有限公司 | BLRY</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollToPlugin.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,800&family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/site.css">
</head>
<body>
  <div class="noise-overlay"></div>
  <canvas id="webgl-bg" aria-hidden="true"></canvas>
  <div id="app"></div>
  <div id="loginOverlay" class="login-overlay">
    <div class="login-modal">
      <button class="login-close js-login-close" type="button" aria-label="关闭登录">&times;</button>
      <h2>管理后台登录</h2>
      <p class="login-sub">欢迎回来，请输入凭据继续管理网站内容</p>
      <div class="login-field"><label for="loginUsername">用户名</label><input id="loginUsername" type="text" placeholder="admin" autocomplete="username"></div>
      <div class="login-field"><label for="loginPassword">密码</label><input id="loginPassword" type="password" placeholder="••••••••" autocomplete="current-password"></div>
      <div class="login-error js-login-error">用户名或密码不正确</div>
      <button class="login-submit js-login-submit" type="button">登录管理后台</button>
    </div>
  </div>
  <script src="content.js"></script>
  <script src="assets/site.js"></script>
</body>
</html>
