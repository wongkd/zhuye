name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - "cloudflare-worker.js"
      - "wrangler.toml"
      - ".github/workflows/deploy-cloudflare.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  preflight:
    name: Validate Cloudflare secrets
    runs-on: ubuntu-latest
    steps:
      - name: Check required GitHub Actions secrets
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=0
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error title=Missing secret::CLOUDFLARE_API_TOKEN is required for Wrangler deploy. Add it in Settings > Secrets and variables > Actions."
            missing=1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error title=Missing secret::CLOUDFLARE_ACCOUNT_ID is required for Worker and Pages deploy. Add it in Settings > Secrets and variables > Actions."
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "Cloudflare deployment secrets are configured."

  deploy-worker:
    name: Deploy CMS Worker
    runs-on: ubuntu-latest
    needs: preflight
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy Worker with Wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy --config wrangler.toml

  # Pages Functions (functions/api/*.js) 不在本 workflow 自动部署，
  # 因为 zhuye-7j5 Pages 项目已存在于 Dashboard，当前 API token 不支持通过 wrangler 创建项目。
  # 当 functions/ 目录变更时，请在终端手动执行：
  #   npx wrangler pages deploy . --project-name=zhuye-7j5 --branch=main --commit-dirty=true
  # 或直接在 Cloudflare Dashboard 上传 functions/ 目录。
